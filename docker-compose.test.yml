version: '3.8'

# Test environment with Mailpit for email testing
# Usage: docker-compose -f docker-compose.test.yml up -d
# Then run: pnpm test:e2e -- --testPathPattern=registration-e2e
#
# IMPORTANT: Uses separate network and ports from dev environment
# Dev: 6200+ (API 6200, postgres 6201, mailpit 6202/6203)
# Test: 6300+ (API 6300, web 6310, postgres 6311, mailpit 6312/6313, minio 6314/6315)

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: synjar-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: synjar_test
    ports:
      - "6311:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - synjar-test

  mailpit-test:
    image: axllent/mailpit
    container_name: synjar-mailpit-test
    ports:
      - "6312:1025"  # SMTP (dev uses 6202)
      - "6313:8025"  # Web UI / API (dev uses 6203)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - synjar-test

  # MinIO - S3-compatible storage for testing (like Mailpit for SMTP)
  # Replaces Backblaze B2 in tests for real file upload/download verification
  minio-test:
    image: minio/minio
    container_name: synjar-minio-test
    ports:
      - "6314:9000"   # S3 API (test port)
      - "6315:9001"   # Console UI (test port)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - synjar-test

  # MinIO bucket initialization
  minio-init:
    image: minio/mc
    container_name: synjar-minio-init
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio-test:9000 minioadmin minioadmin;
      mc mb myminio/synjar-test --ignore-existing;
      mc anonymous set download myminio/synjar-test;
      echo 'Bucket synjar-test created successfully';
      exit 0;
      "
    networks:
      - synjar-test

networks:
  synjar-test:
    driver: bridge
